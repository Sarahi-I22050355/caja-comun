name: caja-comun

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # Solo en el equipo local: el puerto sirve para herramientas de escritorio, no para la red.
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      # Dentro de la red de compose MariaDB escucha en 3306 (el 3307 es solo el puerto publicado al host).
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      ConnectionStrings__Redis: "redis:6379"
      # Parte 2: Trino solo existe con el perfil `federation`; sin él las consultas distribuidas responden 503.
      Trino__Url: http://trino:8080
      JWT_SECRET: ${JWT_SECRET:-}
      SEED_PASSWORD_ADMIN: ${SEED_PASSWORD_ADMIN:-}
      SEED_PASSWORD_CAPTURISTA_GIMSA: ${SEED_PASSWORD_CAPTURISTA_GIMSA:-}
      SEED_PASSWORD_CONSULTA_ACEROS: ${SEED_PASSWORD_CONSULTA_ACEROS:-}
      SEED_PASSWORD_CAPTURISTA_BRAVO: ${SEED_PASSWORD_CAPTURISTA_BRAVO:-}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # La imagen aspnet no trae curl ni wget; se usa un /dev/tcp con bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # ---- Parte 2: federación (opcional) -------------------------------------------------------------------------------
  # docker compose --env-file .env -f infra/docker-compose.yml --profile federation up -d
  # Cada caja vive en un motor distinto y Trino los une: GIMSA en MariaDB, Aceros en PostgreSQL y Transportes en ClickHouse.
  # Límites de memoria: Trino 1.5 GB, ClickHouse 768 MB y PostgreSQL 256 MB. Con el perfil demo en reposo usan unos 1.2 GB en total.
  postgres:
    profiles: [federation]
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: aceros
      POSTGRES_USER: aceros
      POSTGRES_PASSWORD: ${FEDERACION_POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./federacion/postgres/init.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aceros -d aceros"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    profiles: [federation]
    # ClickHouse 26.10 (fijada por huella para que la imagen no cambie sola)
    image: clickhouse/clickhouse-server@sha256:4f491abc44d9f4a1747c033c35ddd5bc385521305d85ca8251ba0824ff597035
    restart: unless-stopped
    mem_limit: 768m
    environment:
      CLICKHOUSE_DB: bravo
      CLICKHOUSE_USER: bravo
      CLICKHOUSE_PASSWORD: ${FEDERACION_CLICKHOUSE_PASSWORD:-}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./federacion/clickhouse/init.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./federacion/clickhouse/memoria.xml:/etc/clickhouse-server/config.d/memoria.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  trino:
    profiles: [federation]
    # Trino 484 (fijada por huella para que la imagen no cambie sola)
    image: trinodb/trino@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      FEDERACION_MARIADB_PASSWORD: ${FEDERACION_MARIADB_PASSWORD:-}
      FEDERACION_POSTGRES_PASSWORD: ${FEDERACION_POSTGRES_PASSWORD:-}
      FEDERACION_CLICKHOUSE_PASSWORD: ${FEDERACION_CLICKHOUSE_PASSWORD:-}
    ports:
      # Solo en el equipo local: sirve para el cliente `trino` y para depurar; la API entra por la red interna.
      - "127.0.0.1:${TRINO_PORT:-8081}:8080"
    volumes:
      - ./federacion/trino/config.properties:/etc/trino/config.properties:ro
      - ./federacion/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 40s

volumes:
  mariadb_data:
  postgres_data:
  clickhouse_data:
