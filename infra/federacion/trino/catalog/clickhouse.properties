# ClickHouse: caja Transportes del Bravo (movimientos históricos, columnar).
connector.name=clickhouse
connection-url=jdbc:clickhouse://clickhouse:8123/?compress=0
connection-user=bravo
connection-password=${ENV:FEDERACION_CLICKHOUSE_PASSWORD}
# String de ClickHouse como varchar (por omisión Trino lo ve como varbinary).
clickhouse.map-string-as-varchar=true
