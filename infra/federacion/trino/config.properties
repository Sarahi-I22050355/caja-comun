# Un solo nodo: coordinador y trabajador a la vez. La memoria se limita aquí y con mem_limit en docker-compose.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=700MB
memory.heap-headroom-per-node=250MB
query.max-execution-time=2m
