# Cabeceras de seguridad de lo que sirve nginx (la API pone las suyas). Se incluye en cada location porque nginx no hereda
# add_header cuando el location define alguno propio.
#
# La aplicación no usa scripts, estilos ni fuentes de otros orígenes: todo sale de este mismo host. 'unsafe-inline' solo en
# estilos (las gráficas y los componentes ajustan estilos en línea); los scripts no pueden ser en línea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $hsts always;
