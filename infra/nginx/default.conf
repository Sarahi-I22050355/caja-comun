# IP de la persona: detrás de Cloudflare Tunnel llega en CF-Connecting-IP (Cloudflare la sobrescribe, no la puede falsificar
# quien entra por el túnel); en local no existe y se usa la del socket. Se *sobrescribe* X-Forwarded-For en lugar de agregarle:
# así nadie puede mandar la suya para saltarse el límite de intentos de inicio de sesión de la API.
# Por eso en producción nginx solo debe ser alcanzable por el túnel (ver docs/despliegue.md).
map $http_cf_connecting_ip $ip_cliente {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# HSTS solo cuando la petición original llegó por HTTPS (Cloudflare envía X-Forwarded-Proto: https).
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # Brotli: la API ya lo usa; para los estáticos lo aplica el borde de Cloudflare (nginx oficial no trae el módulo).

    # Un solo origen: la API se sirve bajo /api. Con varias instancias bastaría
    # definir un upstream con más servidores.
    location /api/ {
        # Importaciones de hasta 2 MB (el límite de la API) más el encabezado del formulario.
        client_max_body_size 3m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ip_cliente;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Los assets llevan hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/seguridad.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/seguridad.conf;
        try_files $uri /index.html;
    }
}
