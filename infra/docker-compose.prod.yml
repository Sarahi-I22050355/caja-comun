# Ajustes de producción sobre docker-compose.yml:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
#
# - nginx solo escucha en 127.0.0.1: lo único que debe alcanzarlo es el túnel de Cloudflare (o un proxy local). Así nadie
#   puede mandar una cabecera CF-Connecting-IP falsa saltándose el túnel.
# - MariaDB deja de publicar su puerto: solo la API la alcanza, por la red interna.
# - Reinicio siempre y registros con rotación para que no llenen el disco.
# Los datos viven en volúmenes con nombre (mariadb_data, postgres_data, clickhouse_data) y sobreviven a `down`; no uses `down -v`.

x-registros: &registros
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    restart: always
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    logging: *registros

  api:
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    logging: *registros

  mariadb:
    restart: always
    ports: !reset []
    logging: *registros

  redis:
    restart: always
    logging: *registros
